<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toddspong</title>
    <!-- The redirect, three ways, in order of how early they take effect.
         A canonical link keeps search engines pointed at the destination. -->
    <meta http-equiv="refresh" content="0; url=https://tridips-mac-mini.taildad1f1.ts.net" />
    <link rel="canonical" href="https://tridips-mac-mini.taildad1f1.ts.net" />
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #faf8f4; color: #332642; text-align: center; padding: 24px;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1726; color: #efe9f5; }
      }
      h1 { font-size: 1.6rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; opacity: 0.8; }
      a {
        display: inline-block; padding: 12px 20px; min-height: 44px;
        border-radius: 24px 30px 26px 32px / 32px 24px 34px 26px;
        background: #594174; color: #fffefa; text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Toddspong</h1>
      <p>Taking you to the room&hellip;</p>
      <!-- Shown when JavaScript is off and the refresh has not fired yet. -->
      <a href="https://tridips-mac-mini.taildad1f1.ts.net">Continue to Toddspong</a>
    </main>
    <script>
      // replace() rather than assign(), so Back does not bounce the person
      // straight back here.
      location.replace("https://tridips-mac-mini.taildad1f1.ts.net" + location.search + location.hash);
    </script>
  </body>
</html>
